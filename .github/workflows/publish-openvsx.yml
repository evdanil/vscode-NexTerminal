# Publishes this extension to Open VSX from version tags.
# Required secret: OVSX_PAT (Open VSX personal access token with publish rights).
# Expected tag format: vX.Y.Z (example: v2.8.32).
name: Publish Open VSX

on:
  push:
    tags:
      - "v*"
  # Called by auto-release.yml: tags it creates with GITHUB_TOKEN cannot
  # trigger the push event above (GitHub's recursion safeguard), so it invokes
  # this workflow directly and names the tag.
  workflow_call:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) the calling workflow created"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-local-pty:
    name: Build Local PTY (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            key: linux-x64
            binary: nexus-local-pty
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-arm64
            binary: nexus-local-pty
          - os: macos-15-intel
            target: x86_64-apple-darwin
            key: darwin-x64
            binary: nexus-local-pty
          - os: macos-15
            target: aarch64-apple-darwin
            key: darwin-arm64
            binary: nexus-local-pty
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            key: win32-x64
            binary: nexus-local-pty.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            key: win32-arm64
            binary: nexus-local-pty.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/local-pty

      - name: Build sidecar
        run: cargo build --manifest-path native/local-pty/Cargo.toml --release --target "${{ matrix.target }}"

      - name: Smoke test sidecar
        run: node scripts/smokeLocalPty.mjs "native/local-pty/target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Prepare artifact
        run: node scripts/collectLocalPtyArtifact.mjs "${{ matrix.target }}" "${{ matrix.key }}"

      - uses: actions/upload-artifact@v4
        with:
          name: local-pty-${{ matrix.key }}
          path: local-pty-dist

  # The twin of release.yml's job of the same name. This workflow publishes
  # independently of release.yml and in parallel with it, so it needs its own
  # copy of every artifact — a matrix added to one and not the other ships a
  # different extension to each registry, which is exactly what happened with
  # v2.8.202: Open VSX got a build with no daemon in it.
  build-network-server-daemon:
    name: Build Network Server Daemon (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            key: linux-x64
            binary: nexus-network-server-daemon
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-arm64
            binary: nexus-network-server-daemon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            key: darwin-x64
            binary: nexus-network-server-daemon
          - os: macos-15
            target: aarch64-apple-darwin
            key: darwin-arm64
            binary: nexus-network-server-daemon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            key: win32-x64
            binary: nexus-network-server-daemon.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            key: win32-arm64
            binary: nexus-network-server-daemon.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/network-server-daemon

      - name: Build daemon
        run: cargo build --manifest-path native/network-server-daemon/Cargo.toml --release --target "${{ matrix.target }}" -p nexus-network-server-daemon

      - name: Smoke test daemon
        run: node scripts/smokeNetworkServerDaemon.mjs "native/network-server-daemon/target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Prepare artifact
        run: node scripts/collectNetworkServerDaemonArtifact.mjs "${{ matrix.target }}" "${{ matrix.key }}"

      - uses: actions/upload-artifact@v4
        with:
          name: network-server-daemon-${{ matrix.key }}
          path: network-server-daemon-dist

  build-and-publish-openvsx:
    needs: [build-local-pty, build-network-server-daemon]
    runs-on: ubuntu-latest
    env:
      # The release tag, however this run started: workflow_call input, or the
      # pushed tag ref.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: local-pty-*
          path: native/local-pty-artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: network-server-daemon-*
          path: native/network-server-daemon-artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          LOCAL_PTY_REQUIRE_ALL: "1"
          NETWORK_SERVER_DAEMON_REQUIRE_ALL: "1"
        run: npm run build:production

      - name: Remove CI-compiled native addons (keep cross-platform prebuilds)
        run: rm -rf node_modules/@serialport/bindings-cpp/build

      - name: Package VSIX for Open VSX
        env:
          LOCAL_PTY_REQUIRE_ALL: "1"
          NETWORK_SERVER_DAEMON_REQUIRE_ALL: "1"
        run: npm run package:ovsx

      - name: Verify VSIX contents
        shell: bash
        run: |
          VSIX_FILE=$(ls *.vsix)
          for platform in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            binary="nexus-local-pty"
            if [[ "$platform" == win32-* ]]; then
              binary="nexus-local-pty.exe"
            fi
            unzip -l "$VSIX_FILE" | grep "extension/dist/native/local-pty/$platform/$binary" || {
              echo "ERROR: Local Shell PTY sidecar missing from VSIX: $platform/$binary"
              exit 1
            }
          done
          for platform in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            binary="nexus-network-server-daemon"
            if [[ "$platform" == win32-* ]]; then
              binary="nexus-network-server-daemon.exe"
            fi
            unzip -l "$VSIX_FILE" | grep "extension/dist/native/network-server-daemon/$platform/$binary" || {
              echo "ERROR: network server daemon missing from VSIX: $platform/$binary"
              exit 1
            }
          done
          echo "VSIX verification passed"

      - name: Publish to Open VSX Registry
        run: npm run publish:ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
