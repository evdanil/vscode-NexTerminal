name: Release VSIX

on:
  push:
    tags:
      - "v*"
  # Called by auto-release.yml: tags it creates with GITHUB_TOKEN cannot
  # trigger the push event above (GitHub's recursion safeguard), so it invokes
  # this workflow directly and names the tag.
  workflow_call:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) the calling workflow created"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: "Publish to VS Code Marketplace"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build-local-pty:
    name: Build Local PTY (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            key: linux-x64
            binary: nexus-local-pty
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-arm64
            binary: nexus-local-pty
          - os: macos-15-intel
            target: x86_64-apple-darwin
            key: darwin-x64
            binary: nexus-local-pty
          - os: macos-15
            target: aarch64-apple-darwin
            key: darwin-arm64
            binary: nexus-local-pty
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            key: win32-x64
            binary: nexus-local-pty.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            key: win32-arm64
            binary: nexus-local-pty.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/local-pty

      - name: Build sidecar
        run: cargo build --manifest-path native/local-pty/Cargo.toml --release --target "${{ matrix.target }}"

      - name: Smoke test sidecar
        run: node scripts/smokeLocalPty.mjs "native/local-pty/target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Prepare artifact
        run: node scripts/collectLocalPtyArtifact.mjs "${{ matrix.target }}" "${{ matrix.key }}"

      - uses: actions/upload-artifact@v4
        with:
          name: local-pty-${{ matrix.key }}
          path: local-pty-dist

  build:
    needs: build-local-pty
    runs-on: ubuntu-latest
    env:
      # The release tag, however this run started: workflow_call input, or the
      # pushed tag ref. Empty for workflow_dispatch (build-only runs).
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: local-pty-*
          path: native/local-pty-artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version from tag
        if: env.RELEASE_TAG != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Setting version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          LOCAL_PTY_REQUIRE_ALL: "1"
        run: npm run build:production

      - name: Run tests
        run: npm test

      - name: Remove CI-compiled native addons (keep cross-platform prebuilds)
        run: rm -rf node_modules/@serialport/bindings-cpp/build

      - name: Package VSIX
        run: npx @vscode/vsce package 
      - name: Verify VSIX contents
        run: |
          VSIX_FILE=$(ls *.vsix)
          echo "VSIX: $VSIX_FILE ($(du -h "$VSIX_FILE" | cut -f1))"
          unzip -l "$VSIX_FILE" | grep -c "serialport" || { echo "ERROR: serialport not found in VSIX"; exit 1; }
          unzip -l "$VSIX_FILE" | grep "prebuilds.*\.node" || { echo "ERROR: native prebuilds not found in VSIX"; exit 1; }
          for platform in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            binary="nexus-local-pty"
            if [[ "$platform" == win32-* ]]; then
              binary="nexus-local-pty.exe"
            fi
            unzip -l "$VSIX_FILE" | grep "extension/dist/native/local-pty/$platform/$binary" || {
              echo "ERROR: Local Shell PTY sidecar missing from VSIX: $platform/$binary"
              exit 1
            }
          done
          echo "VSIX verification passed"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

      - name: Decide whether this release becomes Latest
        if: env.RELEASE_TAG != ''
        id: latest
        run: |
          set -euo pipefail
          # Two releases of DIFFERENT versions can run concurrently (the atomic
          # tag push only arbitrates same-version races), and an older build
          # finishing after a newer one must not re-mark itself as the repo's
          # Latest release. Latest = highest semver among all v* tags plus the
          # one being released, not "most recently published".
          max=$( { git ls-remote --tags origin 'refs/tags/v*' \
              | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}' || true; \
              echo "$RELEASE_TAG"; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "$max" = "$RELEASE_TAG" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $RELEASE_TAG; highest known tag: $max"

      - name: Create GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          files: "*.vsix"
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: >-
          env.RELEASE_TAG != ''
          || inputs.publish_marketplace
        run: npx @vscode/vsce publish --packagePath *.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}


      - name: Prune old npm caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pruning stale npm caches..."
          gh cache list --key node-cache- --json id,createdAt --order desc \
            | jq -r '.[1:][].id' \
            | while read -r id; do
                echo "Deleting cache $id"
                gh cache delete "$id"
              done
          echo "Remaining caches:"
          gh cache list
