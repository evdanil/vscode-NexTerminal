# Pre-merge verification. Until this existed, `npm test` and
# `npm run build:production` ran ONLY inside release.yml / publish-openvsx.yml
# — that is, only at publish time, where a failure is discovered at the moment
# of an irreversible push to the Marketplace and Open VSX. This runs the same
# commands while a failure is still free.
#
# Deliberately NOT a release path: nothing here tags, publishes, or reads a
# publishing secret.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run for the same ref is wasted work. Unlike auto-release.yml —
# which must never be cancelled, because its trigger lives on a head commit no
# later run will ever see again — a CI run carries no such one-shot state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Type-check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # BEFORE the tests, not after: the integration suites load from dist/, so
      # `npm test` first would fail for a missing build rather than a defect.
      # build:production also covers `tsc --noEmit` and the packaged-bundle
      # smoke test (scripts/smokeBundle.mjs).
      - name: Build (type-check + bundle + bundle smoke test)
        run: npm run build:production

      - name: Test
        run: npm test

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      # Full history: the diff below needs both endpoints present locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether the Rust engine needs exercising
        id: filter
        env:
          # A pull_request compares against its base; a push against the
          # previous head. `github.event.before` is all zeroes on a branch's
          # first push, and unreachable after a force-push — both covered by
          # the fallback below.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          # FAIL OPEN, never closed: when the base is unusable we run the Rust
          # job rather than silently skip it. A needless cargo build costs
          # minutes; a skipped one lets a broken crate through.
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base ref unusable ('$BASE') — running the native job."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # WHY THIS IS WIDER THAN `native/` (Codex review, P1). The Rust engine
          # is the PRODUCT DEFAULT (`nexus.networkServers.engine` defaults to
          # "rust" in package.json), but the always-on `npm test` never
          # exercises it: daemonEngineParity.test.ts resolves its engine from
          # NEXUS_NETWORK_SERVERS_ENGINE and falls back to "node", and the only
          # thing that sets that variable to "rust" is
          # scripts/runNetworkServerDaemonRustParity.mjs — which runs solely in
          # the native job below. So with a `native/`-only filter, a change to
          # the TypeScript daemon host, the RPC contract, the parity harness, or
          # the runner itself could break the engine users actually run while
          # every check stayed green. Each path here can alter host<->daemon
          # behaviour without touching a single .rs file:
          #   native/                              the crates themselves
          #   src/services/networkServers/         the TS host + wire protocol
          #   test/integration/networkServers/     the parity harness
          #   scripts/runNetworkServerDaemonRustParity.mjs   the runner
          #   scripts/installNetworkServerDaemonArtifacts.mjs  artifact staging
          #   scripts/buildConfigs.mjs             the daemon bundle's build config
          RUST_RELEVANT_PATHS=(
            native/
            src/services/networkServers/
            test/integration/networkServers/
            scripts/runNetworkServerDaemonRustParity.mjs
            scripts/installNetworkServerDaemonArtifacts.mjs
            scripts/buildConfigs.mjs
          )

          # `git diff --quiet -- <paths>` rather than piping into `grep -q`.
          # Under `set -o pipefail`, grep -q exits at the first match and can
          # SIGPIPE git diff (exit 141), which would take the else branch and
          # report native=false on a large diff that DID touch a relevant path.
          # --quiet exits 0 for "no differences", 1 for "differences".
          if git diff --quiet "$BASE" "$HEAD" -- "${RUST_RELEVANT_PATHS[@]}"; then
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "Decision: native=false (none of ${RUST_RELEVANT_PATHS[*]} changed between $BASE and $HEAD) — the Rust job is skipped."
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Decision: native=true (a Rust-relevant path changed) — the Rust job runs."
            git diff --name-only "$BASE" "$HEAD" -- "${RUST_RELEVANT_PATHS[@]}" | sed 's/^/  /'
          fi

  native:
    name: Rust crates (host target)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/local-pty
            native/network-server-daemon

      # Host target only. release.yml cross-compiles six targets; that belongs
      # at release time. NO `cargo fmt --check` — these crates are not
      # rustfmt-clean, so such a step would fail on arrival rather than report
      # anything real.
      #
      # network-server-daemon is a VIRTUAL WORKSPACE with no default-members,
      # so an unscoped --manifest-path covers all four member crates
      # (tftp, dhcp, rpc, daemon). The release workflow scopes to
      # `-p nexus-network-server-daemon`; broader is correct for CI.
      - name: Build and test local-pty
        run: |
          cargo build --manifest-path native/local-pty/Cargo.toml
          cargo test --manifest-path native/local-pty/Cargo.toml

      - name: Build and test network-server-daemon
        run: |
          cargo build --manifest-path native/network-server-daemon/Cargo.toml
          cargo test --manifest-path native/network-server-daemon/Cargo.toml

      # The ONLY behavioural check that the Rust engine and the JavaScript
      # fallback agree. It ran in no workflow before this one. Needs npm deps
      # and a built daemon, both present by now.
      - name: TypeScript/Rust parity suite
        run: |
          npm ci
          npm run test:network-server-daemon:rust

  policy:
    name: Version bump
    # OWNER-authored pull requests only, and never on push (a push to main has
    # already merged — failing it reports a fact nobody can act on).
    #
    # CONTRIBUTING.md:147 tells outside contributors NOT to bump the version:
    # concurrent pull requests would collide on that line, and the maintainer
    # bumps separately when merging. Running this check on their pull requests
    # would post a permanent red mark they are forbidden to clear. CLAUDE.md's
    # per-pull-request bump rule is addressed to maintainer-authored work, and
    # so is this job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the version to have moved
        env:
          # The pull request's OWN head commit — not the merge commit GitHub
          # checks out — read on TWO axes below: against its own fork point,
          # and against current origin/main. Neither axis alone is enough.
          # Head-vs-origin/main alone misses a branch that forked BEFORE
          # main's own last bump and never bumped at all: if main moves on
          # while the branch sits still, head and origin/main end up unequal
          # even though this pull request changed nothing, and an unrelated
          # main bump satisfies the comparison by accident. Head-vs-fork-point
          # alone misses the opposite case: two branches independently bump to
          # the same next version, and this one merges cleanly after the other
          # already claimed that version's tag. Both checks are needed; see
          # below for which failure each one guards.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          read_version() {
            git show "$1:package.json" \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"
          }

          git fetch --no-tags origin main
          base_version=$(read_version "origin/main")
          head_version=$(read_version "$HEAD_SHA")
          merge_base=$(git merge-base "$HEAD_SHA" origin/main)
          fork_version=$(read_version "$merge_base")

          echo "fork point:        $fork_version"
          echo "origin/main:       $base_version"
          echo "pull request head: $head_version"

          # This pull request itself must have changed the version. Compares
          # against the version AT THE FORK POINT, not against current
          # origin/main, precisely so a stale branch that forked before main's
          # last bump can't pass just because main moved on without it.
          if [ "$head_version" = "$fork_version" ]; then
            echo "::error title=Version not bumped::package.json is still $head_version, unchanged since this pull request's fork point. Every maintainer-authored change pull request bumps the patch version (CLAUDE.md), so main is always ready to release — without the bump, auto-release later refuses with \"tag v$head_version already exists\" and does not say why. Bump the patch version in package.json on this branch and push."
            exit 1
          fi

          # ...and it must be STRICTLY GREATER than what origin/main holds
          # (Codex review, P2). Equality alone was not enough, and passed two
          # bad cases:
          #   - the STALE BUMP: fork at 2.8.207, branch bumps to 2.8.208, main
          #     meanwhile advances to 2.8.209. 2.8.208 differs from both, so
          #     both equality tests passed — yet merging moves main BACKWARD to
          #     a version whose tag may already exist, and auto-release then
          #     refuses the next release with "tag already exists".
          #   - the DOWNGRADE: any accidental edit to a lower version passed for
          #     exactly the same reason.
          # Ordering is the property actually wanted; equality was only ever a
          # proxy for it. Deliberately NOT "must equal main's next patch" — a
          # minor or major bump is legitimate and this must not reject one.
          if ! node -e '
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v.trim());
              if (!m) {
                console.error(`Cannot compare non x.y.z version: "${v}"`);
                process.exit(2);
              }
              return m.slice(1, 4).map(Number);
            };
            const [a, b] = [parse(process.argv[1]), parse(process.argv[2])];
            for (let i = 0; i < 3; i++) {
              if (a[i] !== b[i]) process.exit(a[i] > b[i] ? 0 : 1);
            }
            process.exit(1);
          ' "$head_version" "$base_version"; then
            echo "::error title=Version must move forward::package.json is $head_version, which is not greater than origin/main's $base_version. Merging this would move main backward, onto a version whose tag may already exist — auto-release would then refuse the next release with \"tag already exists\" without saying why. Bump package.json above $base_version on this branch and push."
            exit 1
          fi

          echo "Version moved $fork_version -> $head_version, ahead of origin/main ($base_version)."
