# Pre-merge verification. Until this existed, `npm test` and
# `npm run build:production` ran ONLY inside release.yml / publish-openvsx.yml
# — that is, only at publish time, where a failure is discovered at the moment
# of an irreversible push to the Marketplace and Open VSX. This runs the same
# commands while a failure is still free.
#
# Deliberately NOT a release path: nothing here tags, publishes, or reads a
# publishing secret.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run for the same ref is wasted work. Unlike auto-release.yml —
# which must never be cancelled, because its trigger lives on a head commit no
# later run will ever see again — a CI run carries no such one-shot state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: Type-check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # BEFORE the tests, not after: the integration suites load from dist/, so
      # `npm test` first would fail for a missing build rather than a defect.
      # build:production also covers `tsc --noEmit` and the packaged-bundle
      # smoke test (scripts/smokeBundle.mjs).
      - name: Build (type-check + bundle + bundle smoke test)
        run: npm run build:production

      - name: Type-check tests
        run: npm run typecheck:test

      - name: Test
        run: npm test

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      # Full history: the diff below needs both endpoints present locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether the Rust engine needs exercising
        id: filter
        env:
          # A pull_request compares against its base; a push against the
          # previous head. `github.event.before` is all zeroes on a branch's
          # first push, and unreachable after a force-push — both covered by
          # the fallback below.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          # FAIL OPEN, never closed: when the base is unusable we run the Rust
          # job rather than silently skip it. A needless cargo build costs
          # minutes; a skipped one lets a broken crate through.
          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base ref unusable ('$BASE') — running the native job."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # WHY THIS IS WIDER THAN `native/` (Codex review, P1). The Rust engine
          # is the PRODUCT DEFAULT (`nexus.networkServers.engine` defaults to
          # "rust" in package.json), but the always-on `npm test` never
          # exercises it: daemonEngineParity.test.ts resolves its engine from
          # NEXUS_NETWORK_SERVERS_ENGINE and falls back to "node", and the only
          # thing that sets that variable to "rust" is
          # scripts/runNetworkServerDaemonRustParity.mjs — which runs solely in
          # the native job below. So with a `native/`-only filter, a change to
          # the TypeScript daemon host, the RPC contract, the parity harness, or
          # the runner itself could break the engine users actually run while
          # every check stayed green. Each path here can alter host<->daemon
          # behaviour without touching a single .rs file:
          #   native/                              the crates themselves
          #   src/services/networkServers/         the TS host + wire protocol
          #   test/integration/networkServers/     the parity harness
          #   scripts/runNetworkServerDaemonRustParity.mjs   the runner
          #   scripts/installNetworkServerDaemonArtifacts.mjs  artifact staging
          #   scripts/buildConfigs.mjs             the daemon bundle's build config
          RUST_RELEVANT_PATHS=(
            native/
            src/services/networkServers/
            test/integration/networkServers/
            scripts/runNetworkServerDaemonRustParity.mjs
            scripts/installNetworkServerDaemonArtifacts.mjs
            scripts/buildConfigs.mjs
          )

          # `git diff --quiet -- <paths>` rather than piping into `grep -q`.
          # Under `set -o pipefail`, grep -q exits at the first match and can
          # SIGPIPE git diff (exit 141), which would take the else branch and
          # report native=false on a large diff that DID touch a relevant path.
          # --quiet exits 0 for "no differences", 1 for "differences".
          if git diff --quiet "$BASE" "$HEAD" -- "${RUST_RELEVANT_PATHS[@]}"; then
            echo "native=false" >> "$GITHUB_OUTPUT"
            echo "Decision: native=false (none of ${RUST_RELEVANT_PATHS[*]} changed between $BASE and $HEAD) — the Rust job is skipped."
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
            echo "Decision: native=true (a Rust-relevant path changed) — the Rust job runs."
            git diff --name-only "$BASE" "$HEAD" -- "${RUST_RELEVANT_PATHS[@]}" | sed 's/^/  /'
          fi

  native:
    name: Rust crates (host target)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/local-pty
            native/network-server-daemon

      # Host target only. release.yml cross-compiles six targets; that belongs
      # at release time. NO `cargo fmt --check` — these crates are not
      # rustfmt-clean, so such a step would fail on arrival rather than report
      # anything real.
      #
      # network-server-daemon is a VIRTUAL WORKSPACE with no default-members,
      # so an unscoped --manifest-path covers all four member crates
      # (tftp, dhcp, rpc, daemon). The release workflow scopes to
      # `-p nexus-network-server-daemon`; broader is correct for CI.
      - name: Build and test local-pty
        run: |
          cargo build --manifest-path native/local-pty/Cargo.toml
          cargo test --manifest-path native/local-pty/Cargo.toml

      - name: Build and test network-server-daemon
        run: |
          cargo build --manifest-path native/network-server-daemon/Cargo.toml
          cargo test --manifest-path native/network-server-daemon/Cargo.toml

      # The ONLY behavioural check that the Rust engine and the JavaScript
      # fallback agree. It ran in no workflow before this one. Needs npm deps
      # and a built daemon, both present by now.
      - name: TypeScript/Rust parity suite
        run: |
          npm ci
          npm run test:network-server-daemon:rust

  policy:
    name: Version / changelog
    # OWNER-authored pull requests only, and never on push (a push to main has
    # already merged — failing it reports a fact nobody can act on).
    #
    # CONTRIBUTING.md tells outside contributors to leave the version and the
    # CHANGELOG heading alone: release timing is a maintainer decision, and the
    # maintainer opens the next entry and folds contributed notes into it on
    # merge. Running this check on their pull requests would post a red mark
    # they are told not to clear. The version / top-entry rule in AGENTS.md is
    # addressed to maintainer-authored work, and so is this job.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the next unreleased version, stated consistently
        env:
          # The pull request's OWN head commit — not the merge commit GitHub
          # checks out — because that is what the author controls and can fix.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # THE POLICY (AGENTS.md). Unreleased changes accumulate in ONE
          # CHANGELOG entry headed with the NEXT release version; package.json
          # and package-lock.json carry that same version; a release tags
          # exactly it. So the version does NOT move per pull request — many
          # consecutive pull requests leave it where it is, and equality with
          # origin/main is the normal case, not a mistake.
          #
          # WHY THE OLD RULES ARE GONE. This job used to require the version to
          # differ from the fork point and be greater than origin/main. Both
          # were proxies for "a release will not land on an existing tag" under
          # a per-pull-request bump policy, and both now reject correct work:
          # every pull request after the first in a release cycle keeps the
          # version, and consolidating stray per-PR versions back down to the
          # real next release (main at 2.8.307, latest tag v2.8.295, this
          # branch at 2.8.296) moves the version BACKWARD relative to main on
          # purpose. The property that actually matters is never reusing a
          # released version, so the version is compared against the released
          # tags directly.
          #
          # A pass is only as fresh as the tags it saw: a release tagged while
          # this pull request is open makes it stale. recheck-open-prs.yml
          # re-runs this job on open maintainer pull requests when a v* tag is
          # created, which is why it must stay named "Version / changelog".
          #
          # Tags: checkout with fetch-depth 0 normally brings them, but fetch
          # explicitly so this does not depend on that; --force so a stale
          # local tag cannot mask the remote one.
          git fetch --force --tags --quiet origin

          work=$(mktemp -d)
          for f in package.json package-lock.json CHANGELOG.md; do
            git show "$HEAD_SHA:$f" > "$work/$f"
          done
          git tag -l 'v*' > "$work/tags"

          node - "$work" <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const dir = process.argv[2];
          const read = (f) => fs.readFileSync(path.join(dir, f), "utf8");

          // Plain x.y.z only; the node comparison below is numeric per field,
          // so 2.8.10 > 2.8.9 (a string compare gets that wrong).
          const parse = (v) => {
            const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(String(v).trim());
            return m ? m.slice(1, 4).map(Number) : null;
          };
          const cmp = (a, b) => {
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i];
            return 0;
          };

          const errors = [];
          const fail = (title, msg) => errors.push(`::error title=${title}::${msg}`);

          const version = JSON.parse(read("package.json")).version;
          const v = parse(version);
          if (!v) {
            console.log(`::error title=Unparseable version::package.json version "${version}" is not x.y.z; this check compares plain x.y.z versions only.`);
            process.exit(1);
          }

          // 1. package-lock.json carries the same version in both places npm
          //    writes it; a mismatch means a hand edit updated only one file.
          const lock = JSON.parse(read("package-lock.json"));
          const lockTop = lock.version;
          const lockRoot = lock.packages && lock.packages[""] ? lock.packages[""].version : undefined;
          if (lockTop !== version || lockRoot !== version) {
            fail("package-lock.json out of step",
              `package-lock.json has version ${lockTop} and packages[""].version ${lockRoot}; both must equal package.json's ${version}. Set all three together (npm version ${version} --no-git-tag-version --allow-same-version).`);
          }

          // 2. The top CHANGELOG entry is the one unreleased entry, headed
          //    with the version that will be released.
          const heading = /^## \[([^\]]+)\]/m.exec(read("CHANGELOG.md"));
          const top = heading ? heading[1] : undefined;
          if (top !== version) {
            fail("CHANGELOG heading mismatch",
              `The top CHANGELOG.md entry is ${top ? `[${top}]` : "missing"}, but package.json is ${version}. They must match: unreleased changes go in ONE entry headed with the next release version, which package.json and package-lock.json also carry. Add this pull request's notes to that entry instead of opening a new heading per pull request.`);
          }

          // 3. The version is STRICTLY GREATER than every released tag, so a
          //    release can never land on a version already published (and
          //    never on an existing tag, which auto-release refuses without
          //    saying why). Not "equal to latest + 1 patch": a minor or major
          //    bump is the maintainer's call and must pass.
          const released = read("tags").split(/\r?\n/)
            .map((t) => t.trim())
            .filter(Boolean)
            .map((t) => ({ tag: t, parts: parse(t.slice(1)) }))
            .filter((t) => t.parts);
          let latest;
          for (const t of released) if (!latest || cmp(t.parts, latest.parts) > 0) latest = t;

          console.log(`package.json:           ${version}`);
          console.log(`package-lock.json:      ${lockTop} / packages[""] ${lockRoot}`);
          console.log(`CHANGELOG top entry:    ${top ?? "(none)"}`);
          console.log(`latest release tag:     ${latest ? latest.tag : "(none)"}`);

          if (latest && cmp(v, latest.parts) <= 0) {
            const next = `${latest.parts[0]}.${latest.parts[1]}.${latest.parts[2] + 1}`;
            const already = cmp(v, latest.parts) === 0 ? `${version} is already released. ` : "";
            fail("Version already released",
              `package.json is ${version}, not greater than the latest release tag ${latest.tag}. ${already}Open the next unreleased entry: set package.json, package-lock.json and a new top CHANGELOG heading to ${next} (or a minor/major bump if intended) and put this pull request's notes there. Published entries are never edited.`);
          }

          if (errors.length) {
            for (const e of errors) console.log(e);
            process.exit(1);
          }
          console.log(latest
            ? `OK: ${version} is the next unreleased version (after ${latest.tag}) and is stated consistently.`
            : `OK: no v* release tag yet; ${version} is stated consistently.`);
          EOF
