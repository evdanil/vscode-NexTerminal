# Releases ONLY when a merge explicitly opts in.
#
# Version bumps are routine — every change PR carries one — so a version change
# is NOT a release signal on its own. This workflow releases only when the merge
# (squash) commit message contains "[release]". It then creates the v{version}
# tag and runs the full pipeline (VSIX build + GitHub Release + VS Code
# Marketplace, and Open VSX) by CALLING release.yml and publish-openvsx.yml
# directly. Calling them is deliberate, not a convenience: tags pushed with the
# workflow's own GITHUB_TOKEN do not trigger other workflows (a GitHub
# safeguard against recursive Actions), so the tag alone would release nothing.
#
# WHY OPT-IN RATHER THAN OPT-OUT. This was previously the inverse: a version
# change released unless the merge said "[skip release]". That default is unsafe
# once every change PR bumps the version, because the failure mode of forgetting
# the marker is publishing to two public registries immediately and
# irreversibly — a version cannot be unpublished or re-used. With opt-in, the
# failure mode of forgetting the marker is that nothing happens and you merge
# again, or push the tag by hand. The safe outcome is the default one.
#
# TO RELEASE, either:
#   1. Put "[release]" in the merge (squash) commit message, or
#   2. Push the v{version} tag yourself — tag pushes trigger release.yml and
#      publish-openvsx.yml directly, exactly as they did before this workflow
#      existed.
#
# A release still requires the version to have CHANGED on this push: the tag
# for an unchanged version already exists, and no version may be published
# twice. Merging a bumped PR without "[release]" lands the version on main and
# publishes nothing; releasing it later is a manual tag push.

name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

# DELIBERATELY NO concurrency group. GitHub keeps at most ONE pending run per
# group, so a version-bump run queued behind an active release could be
# replaced (canceled) by a later docs-only push — and because the decision
# below compares each push against its own base, the replaced push's version
# would then never release. Correctness here relies on every push run being
# allowed to complete. Races between simultaneous runs are serialized by the
# tag push itself instead: a git ref creation is atomic server-side, so the
# loser sees the tag exist and skips the release jobs (see the tag job).

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the base of a multi-commit push may not be HEAD^.
          fetch-depth: 0

      - name: Decide whether this push releases
        id: decide
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          release=false
          reason="no [release] marker in the head commit message"

          # THE OPT-IN. Nothing releases without this marker, and the marker
          # must be a LINE OF ITS OWN — not a substring anywhere in the message.
          # A substring test reads "Do not [release] this PR yet" as consent and
          # publishes, which is the exact failure this opt-in model exists to
          # make impossible; prose about releasing must never be able to
          # release. A whole-line match makes the marker a deliberate act that
          # cannot be produced by discussing one. Surrounding whitespace (and a
          # CR from a CRLF message) is tolerated; nothing else on the line is.
          # This also cannot be matched by the retired "[skip release]" opt-out.
          if grep -qiE '^[[:space:]]*\[release\][[:space:]]*$' <<<"$HEAD_MSG"; then
            release=true
            reason="head commit message contains [release]"
          fi

          # A release still requires a NEW version: the tag for an unchanged
          # one already exists, and no version may be published twice.
          if [ "$release" = true ]; then
            base="$BASE_SHA"
            if [ -z "$base" ] \
              || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse -q --verify HEAD^ || true)
            fi
            if [ -n "$base" ]; then
              prev=$(git show "$base:package.json" \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
              if [ "$prev" = "$version" ]; then
                release=false
                reason="version unchanged ($version)"
              fi
            fi
          fi

          # The tag already exists (a manual release beat us).
          if [ "$release" = true ] \
            && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            release=false
            reason="tag $tag already exists"
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Decision: release=$release ($reason)"

  tag:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Create and push the release tag
        id: tag
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          # The serialization point: ref creation is atomic, so exactly one
          # concurrent run can win. A loser is not an error — someone else
          # released this version — it just must not run the release jobs.
          if git push origin "refs/tags/$TAG"; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — another run won the race; skipping release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag push failed and $TAG does not exist — real failure." >&2
            exit 1
          fi

  release:
    needs: [decide, tag]
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.decide.outputs.tag }}
    secrets: inherit

  openvsx:
    needs: [decide, tag]
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/publish-openvsx.yml
    with:
      tag: ${{ needs.decide.outputs.tag }}
    secrets: inherit
